name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_run:
    workflows: ["Update Firmware Releases"]
    types:
      - completed
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Skip if push was made by GitHub Action (to avoid race condition)
    # Only run on workflow_run trigger OR manual pushes
    if: |
      github.event_name == 'workflow_run' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.actor != 'github-actions[bot]')

    steps:
    - name: Wait for commit propagation (workflow_run only)
      if: github.event_name == 'workflow_run'
      run: sleep 10
      
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    
    - name: Ensure latest commit
      run: |
        git fetch origin main
        git reset --hard origin/main
        echo "Current commit: $(git rev-parse HEAD)"
        echo "Latest main commit: $(git rev-parse origin/main)"
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Next.js app
      run: npm run build
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./out
        cname: flasher.bitronics.store
